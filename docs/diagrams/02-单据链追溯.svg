<text x="610.0" y="122.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="600">purchase_order</text>
<text x="610.0" y="144.0" font-size="11.5" fill="#5a6b7b" text-anchor="middle" font-weight="normal">采购订单</text>
<text x="610.0" y="161.0" font-size="9.6" fill="#9aa9b8" text-anchor="middle" font-weight="normal">三状态正交（生命周期/审核/履约）</text>
<text x="610.0" y="80.0" font-size="10.2" fill="#7c8fa3" text-anchor="middle" font-weight="normal">采购主管会签</text>
