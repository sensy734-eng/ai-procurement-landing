<rect x="8.0" y="372.0" width="1184.0" height="80.0" rx="6" fill="#fbfcfd" stroke="#e3e9f1" stroke-width="1"/>
<text x="24.0" y="396.0" font-size="11" fill="#41556b" text-anchor="start" font-weight="600">驳回：</text>
<text x="60.0" y="396.0" font-size="11" fill="#5a6b7b" text-anchor="start" font-weight="normal">lifecycle 回落 1（草稿）、audit = 3；不新增第 6 个生命周期值，否则「草稿」与「被驳回的草稿」会分成两种状态、两套筛选。</text>
<text x="24.0" y="418.0" font-size="11" fill="#41556b" text-anchor="start" font-weight="600">撤回与重提：</text>
<text x="93.0" y="418.0" font-size="11" fill="#5a6b7b" text-anchor="start" font-weight="normal">撤回时未处理的任务置 4（失效）；重新提交生成新批次任务——用任务 id 区间判定本次提交产生的任务，不靠时间戳（秒级分不清同秒操作）。</text>
<text x="24.0" y="440.0" font-size="11" fill="#41556b" text-anchor="start" font-weight="600">审批历史：</text>
<text x="82.0" y="440.0" font-size="11" fill="#5a6b7b" text-anchor="start" font-weight="normal">不另建表，按 node_seq 与自增 id 排序即得；任务状态 1 待处理、2 已通过、3 已驳回、4 已失效。</text>
