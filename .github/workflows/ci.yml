name: workbench-checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: chmod +x server/mvnw && cd server && ./mvnw -B verify
      - run: python scripts/check_database_tests.py
      - run: npm ci && npm run typecheck && npm run build
        working-directory: web
      - run: python scripts/gen_api_list.py --check
      - run: python scripts/ai_eval_runner.py --check
      - run: python scripts/ai_task_eval_runner.py --check
      - run: python scripts/check_product_artifacts.py
      - run: python scripts/check_doc_links.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: docker compose config --quiet
      - run: docker compose up --build -d
        env:
          BUILD_COMMIT: ${{ github.sha }}
      - run: python scripts/smoke_workbench.py
      - run: python scripts/smoke_ai_tasks.py
      - run: |
          mkdir -p artifacts/productization
          docker compose logs --no-color > artifacts/productization/compose-ci.log
        if: always()
      - run: docker compose down
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            server/target/*-reports/
            artifacts/productization/
            artifacts/ai-task-assistants/
