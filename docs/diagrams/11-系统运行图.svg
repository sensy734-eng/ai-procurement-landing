<text x="384.0" y="637.0" font-size="11.6" fill="#1f2937" text-anchor="middle" font-weight="600">采购订单</text>
<line x1="484.0" y1="632.0" x2="493.0" y2="632.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="502.0" y="608.0" width="196.0" height="48.0" rx="7" fill="#ffffff" stroke="#2e5f8a" stroke-width="1.2"/>
<text x="600.0" y="637.0" font-size="11.6" fill="#1f2937" text-anchor="middle" font-weight="600">到货验收</text>
<line x1="700.0" y1="632.0" x2="709.0" y2="632.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="718.0" y="608.0" width="196.0" height="48.0" rx="7" fill="#ffffff" stroke="#2e5f8a" stroke-width="1.2"/>
<text x="816.0" y="637.0" font-size="11.6" fill="#1f2937" text-anchor="middle" font-weight="600">采购入库</text>
<line x1="916.0" y1="632.0" x2="925.0" y2="632.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="934.0" y="608.0" width="196.0" height="48.0" rx="7" fill="#ffffff" stroke="#2e5f8a" stroke-width="1.2"/>
<text x="1032.0" y="637.0" font-size="11.6" fill="#1f2937" text-anchor="middle" font-weight="600">库存查询</text>
<text x="28.0" y="712.0" font-size="10.8" fill="#41556b" text-anchor="start" font-weight="600">横切能力（三条，全链路生效）</text>
<rect x="40.0" y="722.0" width="360.0" height="62.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.2"/>
<text x="56.0" y="744.0" font-size="10.8" fill="#1f2937" text-anchor="start" font-weight="600">权限与数据范围</text>
<text x="56.0" y="762.0" font-size="9.2" fill="#5a6b7b" text-anchor="start" font-weight="normal">deptScope / warehouseScope 由后端注入</text>
<text x="56.0" y="775.0" font-size="9.2" fill="#5a6b7b" text-anchor="start" font-weight="normal">拿不到范围 → 哨兵值失败关闭</text>
<rect x="420.0" y="722.0" width="360.0" height="62.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.2"/>
<text x="436.0" y="744.0" font-size="10.8" fill="#1f2937" text-anchor="start" font-weight="600">审计留痕</text>
<text x="436.0" y="762.0" font-size="9.2" fill="#5a6b7b" text-anchor="start" font-weight="normal">ai_query_audit 记录问句 / 意图 / 参数 / 结果码</text>
<text x="436.0" y="775.0" font-size="9.2" fill="#5a6b7b" text-anchor="start" font-weight="normal">拒绝的参数单独落 rejected_params</text>
<rect x="800.0" y="722.0" width="360.0" height="62.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.2"/>
<text x="816.0" y="744.0" font-size="10.8" fill="#1f2937" text-anchor="start" font-weight="600">只读边界</text>
<text x="816.0" y="762.0" font-size="9.2" fill="#5a6b7b" text-anchor="start" font-weight="normal">AI 侧没有任何写接口</text>
<text x="816.0" y="775.0" font-size="9.2" fill="#5a6b7b" text-anchor="start" font-weight="normal">写操作在路由前就被拒绝，与模型无关</text>
</svg>