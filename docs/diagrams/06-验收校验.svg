<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41556b"/></marker><marker id="ahL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa3b8"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0562b"/></marker></defs>
<rect width="1200" height="430" fill="#ffffff"/>
<text x="24.0" y="30.0" font-size="13" fill="#9aa9b8" text-anchor="start" font-weight="normal">图 6　到货验收的三道校验：到货配额、合格守恒、入库配额</text>
<rect x="45.0" y="92.0" width="190.0" height="78.0" rx="8" fill="#ffffff" stroke="#2e5f8a" stroke-width="1.4"/>
<text x="140.0" y="124.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">到货登记</text>
<text x="140.0" y="146.0" font-size="9.6" fill="#5a6b7b" text-anchor="middle" font-weight="normal">验收单草稿</text>
<rect x="285.0" y="92.0" width="190.0" height="78.0" rx="8" fill="#fbf0ea" stroke="#c0562b" stroke-width="1.4"/>
<text x="380.0" y="124.0" font-size="12" fill="#c0562b" text-anchor="middle" font-weight="600">配额①校验</text>
<text x="380.0" y="146.0" font-size="9.6" fill="#c0562b" text-anchor="middle" font-weight="normal">到货量不超订单</text>
<rect x="525.0" y="92.0" width="190.0" height="78.0" rx="8" fill="#ffffff" stroke="#2e5f8a" stroke-width="1.4"/>
<text x="620.0" y="124.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">合格 / 不合格判定</text>
<text x="620.0" y="146.0" font-size="9.6" fill="#5a6b7b" text-anchor="middle" font-weight="normal">逐明细行登记</text>
<rect x="765.0" y="92.0" width="190.0" height="78.0" rx="8" fill="#ffffff" stroke="#2e5f8a" stroke-width="1.4"/>
<text x="860.0" y="124.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">验收提交</text>
<text x="860.0" y="146.0" font-size="9.6" fill="#5a6b7b" text-anchor="middle" font-weight="normal">整单结果由明细重算</text>
<rect x="1005.0" y="92.0" width="190.0" height="78.0" rx="8" fill="#eaf4ef" stroke="#2e7d5b" stroke-width="1.4"/>
<text x="1100.0" y="124.0" font-size="12" fill="#2e7d5b" text-anchor="middle" font-weight="600">生成入库单</text>
<text x="1100.0" y="146.0" font-size="9.6" fill="#2e7d5b" text-anchor="middle" font-weight="normal">只带合格量</text>
<line x1="240.0" y1="131.0" x2="273.0" y2="131.0" stroke="#41556b" stroke-width="1.7" marker-end="url(#ah)"/>
<line x1="480.0" y1="131.0" x2="513.0" y2="131.0" stroke="#41556b" stroke-width="1.7" marker-end="url(#ah)"/>
<line x1="720.0" y1="131.0" x2="753.0" y2="131.0" stroke="#41556b" stroke-width="1.7" marker-end="url(#ah)"/>
<line x1="960.0" y1="131.0" x2="993.0" y2="131.0" stroke="#41556b" stroke-width="1.7" marker-end="url(#ah)"/>
<rect x="45.0" y="208.0" width="552.0" height="96.0" rx="8" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.2"/>
<rect x="45.0" y="208.0" width="4.0" height="96.0" rx="2" fill="#c0562b" stroke="none" stroke-width="0"/>
<text x="63.0" y="234.0" font-size="11.6" fill="#c0562b" text-anchor="start" font-weight="600">配额 ①　到货不得超量</text>
<rect x="63.0" y="246.0" width="516.0" height="26.0" rx="4" fill="#f5f8fb" stroke="none" stroke-width="0"/>
<text x="75.0" y="264.0" font-size="10.6" fill="#1f2937" text-anchor="start" font-weight="normal">本次到货量 ≤ 订单量 − 累计已到货量</text>
<text x="63.0" y="292.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">防止同一订单被重复登记到货；草稿验收单同样占用配额。</text>
<rect x="621.0" y="208.0" width="534.0" height="96.0" rx="8" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.2"/>
<rect x="621.0" y="208.0" width="4.0" height="96.0" rx="2" fill="#2e5f8a" stroke="none" stroke-width="0"/>
<text x="639.0" y="234.0" font-size="11.6" fill="#2e5f8a" text-anchor="start" font-weight="600">守恒　合格 + 不合格 = 到货量</text>
<rect x="639.0" y="246.0" width="498.0" height="26.0" rx="4" fill="#f5f8fb" stroke="none" stroke-width="0"/>
<text x="651.0" y="264.0" font-size="10.6" fill="#1f2937" text-anchor="start" font-weight="normal">登记与提交两处都校验</text>
<text x="639.0" y="292.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">缺一档默认全合格；整单结果由明细重算，让步是整单动作。</text>
<rect x="45.0" y="318.0" width="552.0" height="96.0" rx="8" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.2"/>
<rect x="45.0" y="318.0" width="4.0" height="96.0" rx="2" fill="#2e7d5b" stroke="none" stroke-width="0"/>
<text x="63.0" y="344.0" font-size="11.6" fill="#2e7d5b" text-anchor="start" font-weight="600">配额 ②　入库不得超量</text>
<rect x="63.0" y="356.0" width="516.0" height="26.0" rx="4" fill="#f5f8fb" stroke="none" stroke-width="0"/>
<text x="75.0" y="374.0" font-size="10.6" fill="#1f2937" text-anchor="start" font-weight="normal">入库量 ≤ 订单量 − 累计已生成入库量</text>
<text x="63.0" y="402.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">累计含草稿与已确认、不含已作废——草稿也占配额，作废才释放。</text>
<rect x="621.0" y="318.0" width="534.0" height="96.0" rx="8" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.2"/>
<rect x="621.0" y="318.0" width="4.0" height="96.0" rx="2" fill="#5b4b8a" stroke="none" stroke-width="0"/>
<text x="639.0" y="344.0" font-size="11.6" fill="#5b4b8a" text-anchor="start" font-weight="600">例外　不合格不入库</text>
<rect x="639.0" y="356.0" width="498.0" height="26.0" rx="4" fill="#f5f8fb" stroke="none" stroke-width="0"/>
<text x="651.0" y="374.0" font-size="10.6" fill="#1f2937" text-anchor="start" font-weight="normal">入库量 = 合格量（让步时含被放行的不合格量）</text>
<text x="639.0" y="402.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">全不合格且未让步的单据生成入库单返回 NoData。</text>
</svg>