<rect x="860.0" y="269.0" width="200.0" height="4.0" rx="2" fill="#2e5f8a" stroke="none" stroke-width="0"/>
<text x="960.0" y="298.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="600">stock_balance</text>
<text x="960.0" y="320.0" font-size="11.5" fill="#5a6b7b" text-anchor="middle" font-weight="normal">库存余额</text>
<text x="960.0" y="337.0" font-size="9.6" fill="#9aa9b8" text-anchor="middle" font-weight="normal">物料+仓库+批次+归属</text>
<text x="960.0" y="364.0" font-size="10.2" fill="#7c8fa3" text-anchor="middle" font-weight="normal">系统自动累加</text>
