<text x="54.0" y="665.0" font-size="10.4" fill="#c0562b" text-anchor="start" font-weight="600">兜底档</text>
<text x="106.0" y="627.0" font-size="9.8" fill="#5a6b7b" text-anchor="start" font-weight="normal">LlmAnswerComposer：基于召回片段成文，标引用编号</text>
<text x="106.0" y="665.0" font-size="9.8" fill="#5a6b7b" text-anchor="start" font-weight="normal">模板直引条款原文；教程型按原文顺序拆步骤</text>
