<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41556b"/></marker><marker id="ahL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa3b8"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0562b"/></marker></defs>
<rect width="1200" height="820" fill="#ffffff"/>
<text x="24.0" y="30.0" font-size="13" fill="#9aa9b8" text-anchor="start" font-weight="normal">图 11　整个系统的运行图：请求怎么走、业务怎么跑、AI 挂在哪</text>
<rect x="40.0" y="66.0" width="600.0" height="58.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.3"/>
<text x="60.0" y="90.0" font-size="11.8" fill="#1f2937" text-anchor="start" font-weight="600">浏览器　Vue3 + TS + Vite + Element Plus</text>
<text x="60.0" y="108.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">27 个页面 · JWT 登录态 · 菜单与按钮按权限点渲染</text>
<rect x="40.0" y="148.0" width="600.0" height="58.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.3"/>
<text x="60.0" y="172.0" font-size="11.8" fill="#1f2937" text-anchor="start" font-weight="600">接入层　AuthInterceptor → @RequirePermission</text>
<text x="60.0" y="190.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">认证在前、鉴权在后；权限点形如　模块:对象:动作</text>
<rect x="40.0" y="230.0" width="600.0" height="58.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.3"/>
<text x="60.0" y="254.0" font-size="11.8" fill="#1f2937" text-anchor="start" font-weight="600">控制层　Controller　183 个接口</text>
<text x="60.0" y="272.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">M1~M12 十二个模块，接口清单由 gen_api_list.py 校验</text>
<rect x="40.0" y="312.0" width="600.0" height="82.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.3"/>
<text x="60.0" y="336.0" font-size="11.8" fill="#1f2937" text-anchor="start" font-weight="600">服务层　Service　业务规则都在这一层</text>
<text x="60.0" y="354.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">五环节流转 · 三状态正交（lifecycle / audit / fulfill）</text>
<text x="60.0" y="367.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">库存唯一写入点 = 入库单确认（同事务写余额与流水）</text>
<text x="60.0" y="380.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">M4 双配额 · 验收守恒 · 参考价版本链</text>
<rect x="40.0" y="412.0" width="600.0" height="58.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.3"/>
<text x="60.0" y="436.0" font-size="11.8" fill="#1f2937" text-anchor="start" font-weight="600">数据层　Mapper　MyBatis-Plus</text>
<text x="60.0" y="454.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">逻辑删除 · 乐观锁 version · 分页与条件构造</text>
<rect x="40.0" y="494.0" width="600.0" height="66.0" rx="8" fill="#eaf4ef" stroke="#2e7d5b" stroke-width="1.3"/>
<text x="60.0" y="518.0" font-size="11.8" fill="#2e7d5b" text-anchor="start" font-weight="600">MySQL　procurement_db</text>
<text x="60.0" y="536.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">49 张表 · 718 个字段 · A~H 八个业务域</text>
<line x1="340.0" y1="124.0" x2="340.0" y2="141.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="340.0" y1="206.0" x2="340.0" y2="223.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="340.0" y1="288.0" x2="340.0" y2="305.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="340.0" y1="394.0" x2="340.0" y2="405.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="340.0" y1="470.0" x2="340.0" y2="487.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="680.0" y="52.0" font-size="11.2" fill="#41556b" text-anchor="start" font-weight="600">AI 子系统（旁路接入，模型可关）</text>
<rect x="680.0" y="66.0" width="480.0" height="56.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.3"/>
<text x="700.0" y="90.0" font-size="11.8" fill="#1f2937" text-anchor="start" font-weight="600">M7　编排入口　/api/assistant/chat</text>
<text x="700.0" y="108.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">会话上下文 · 路由判定 · 结果组装</text>
<rect x="680.0" y="140.0" width="228.0" height="64.0" rx="8" fill="#ffffff" stroke="#a99cc9" stroke-width="1.3"/>
<text x="794.0" y="164.0" font-size="10.8" fill="#5b4b8a" text-anchor="middle" font-weight="600">M8　制度与教程问答</text>
<text x="794.0" y="182.0" font-size="9.4" fill="#5a6b7b" text-anchor="middle" font-weight="normal">双路检索 · 拒答 · 成文</text>
<rect x="932.0" y="140.0" width="228.0" height="64.0" rx="8" fill="#ffffff" stroke="#a99cc9" stroke-width="1.3"/>
<text x="1046.0" y="164.0" font-size="10.8" fill="#5b4b8a" text-anchor="middle" font-weight="600">M9　受控自然语言查询</text>
<text x="1046.0" y="182.0" font-size="9.4" fill="#5a6b7b" text-anchor="middle" font-weight="normal">理解层 · 四道闸 · 只读</text>
<line x1="794.0" y1="122.0" x2="794.0" y2="129.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="1046.0" y1="122.0" x2="1046.0" y2="129.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="794.0" y1="204.0" x2="794.0" y2="215.0" stroke="#8fa3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ahL)"/>
<line x1="1046.0" y1="204.0" x2="1046.0" y2="215.0" stroke="#8fa3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ahL)"/>
<rect x="680.0" y="222.0" width="480.0" height="64.0" rx="8" fill="#fbfcfd" stroke="#a99cc9" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="920.0" y="246.0" font-size="10.8" fill="#5b4b8a" text-anchor="middle" font-weight="600">外部大模型（可选）</text>
<text x="920.0" y="264.0" font-size="9.4" fill="#5a6b7b" text-anchor="middle" font-weight="normal">DeepSeek · 超时 / 失败 / 输出不合契约即熔断，整条退回规则档</text>
<rect x="680.0" y="306.0" width="480.0" height="56.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.3"/>
<text x="700.0" y="330.0" font-size="11.8" fill="#1f2937" text-anchor="start" font-weight="600">AiChannelGuard　三通道熔断 + 截止预算</text>
<text x="700.0" y="348.0" font-size="9.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">route 1.5s / plan 2.5s / answer 2.5s，只能收紧不能放宽</text>
<rect x="680.0" y="382.0" width="480.0" height="116.0" rx="8" fill="#fbfcfd" stroke="#a99cc9" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="700.0" y="406.0" font-size="10.8" fill="#5b4b8a" text-anchor="start" font-weight="600">AI 不进主流程</text>
<text x="700.0" y="428.0" font-size="9.4" fill="#5a6b7b" text-anchor="start" font-weight="normal">读库经 Service / Mapper，与页面同一条路径，不直连数据库</text>
<text x="700.0" y="444.0" font-size="9.4" fill="#5a6b7b" text-anchor="start" font-weight="normal">关掉模型：问答退模板、查询退规则，下单与入库不受影响</text>
<text x="700.0" y="460.0" font-size="9.4" fill="#5a6b7b" text-anchor="start" font-weight="normal">任一通道熔断只影响本次回答，不阻断业务操作</text>
<text x="700.0" y="476.0" font-size="9.4" fill="#5a6b7b" text-anchor="start" font-weight="normal">四道闸、数据范围、只读拒绝与模型无关，两档共用</text>
<rect x="8.0" y="574.0" width="1184.0" height="104.0" rx="8" fill="#fbfcfd" stroke="#e3e9f1" stroke-width="1"/>
<text x="28.0" y="598.0" font-size="10.8" fill="#41556b" text-anchor="start" font-weight="600">业务主流程（五个环节一条单据链）</text>
<rect x="70.0" y="608.0" width="196.0" height="48.0" rx="7" fill="#ffffff" stroke="#2e5f8a" stroke-width="1.2"/>
<text x="168.0" y="637.0" font-size="11.6" fill="#1f2937" text-anchor="middle" font-weight="600">采购申请</text>
