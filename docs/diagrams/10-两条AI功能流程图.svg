<rect x="641.0" y="478.0" width="518.0" height="37.0" rx="7" fill="#fbf0ea" stroke="none" stroke-width="0"/>
<text x="654.0" y="463.0" font-size="10.4" fill="#2e5f8a" text-anchor="start" font-weight="600">模型档</text>
<text x="654.0" y="501.0" font-size="10.4" fill="#c0562b" text-anchor="start" font-weight="600">兜底档</text>
<text x="706.0" y="463.0" font-size="9.8" fill="#5a6b7b" text-anchor="start" font-weight="normal">一次调用给出：意图 + 实体指称 + 参数 + 时间归一</text>
<text x="706.0" y="501.0" font-size="9.8" fill="#5a6b7b" text-anchor="start" font-weight="normal">词表权重 + 正则参数 + 三级实体匹配</text>
<rect x="640.0" y="536.0" width="520.0" height="56.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.3"/>
<text x="900.0" y="560.0" font-size="11.6" fill="#1f2937" text-anchor="middle" font-weight="600">实体指称 → 撞库 → 主键</text>
<text x="900.0" y="578.0" font-size="9.6" fill="#5a6b7b" text-anchor="middle" font-weight="normal">模型只给类型 / 业务编号 / 原话，主键一律由后端撞库得出</text>
<rect x="640.0" y="612.0" width="520.0" height="64.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.3"/>
<text x="900.0" y="636.0" font-size="11.6" fill="#1f2937" text-anchor="middle" font-weight="600">四道闸（两档共用，位置不变）</text>
<text x="900.0" y="654.0" font-size="9.6" fill="#5a6b7b" text-anchor="middle" font-weight="normal">意图在白名单　/　实体已归一　/　参数名合法　/　操作符与枚举合法</text>
<rect x="640.0" y="696.0" width="520.0" height="56.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.3"/>
<text x="900.0" y="720.0" font-size="11.6" fill="#1f2937" text-anchor="middle" font-weight="600">执行：只读 + 数据范围强制注入</text>
<text x="900.0" y="738.0" font-size="9.6" fill="#5a6b7b" text-anchor="middle" font-weight="normal">deptScope / warehouseScope 由后端按登录人注入，模型无从干预</text>
<rect x="640.0" y="772.0" width="520.0" height="52.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.3"/>
<text x="900.0" y="796.0" font-size="11.6" fill="#1f2937" text-anchor="middle" font-weight="600">转述 + 审计落库（ai_query_audit）</text>
<line x1="900.0" y1="516.0" x2="900.0" y2="529.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="900.0" y1="592.0" x2="900.0" y2="605.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="900.0" y1="676.0" x2="900.0" y2="689.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="900.0" y1="752.0" x2="900.0" y2="765.0" stroke="#41556b" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="8.0" y="852.0" width="1184.0" height="62.0" rx="6" fill="#fbfcfd" stroke="#e3e9f1" stroke-width="1"/>
<text x="24.0" y="874.0" font-size="10.8" fill="#41556b" text-anchor="start" font-weight="600">分叉在哪：</text>
<text x="82.0" y="874.0" font-size="10.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">模型可用、输出可解析、编码在白名单、置信度达阈值 → 模型档；未配置 / 超时 / 限流 / 输出不合契约 / 编码越界 / 低置信 → 整条走兜底档，用户无感。</text>
<text x="24.0" y="896.0" font-size="10.8" fill="#41556b" text-anchor="start" font-weight="600">什么不变：</text>
<text x="82.0" y="896.0" font-size="10.6" fill="#5a6b7b" text-anchor="start" font-weight="normal">四道闸、数据范围、只读拒绝位置两档共用——模型说错话的代价是「按错意图查了一次受限数据」，不是绕过权限。</text>
