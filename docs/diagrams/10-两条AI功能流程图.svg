<text x="300.0" y="724.0" font-size="11.6" fill="#1f2937" text-anchor="middle" font-weight="600">数字一致性守卫 AnswerFidelityGuard</text>
<text x="300.0" y="742.0" font-size="9.6" fill="#5a6b7b" text-anchor="middle" font-weight="normal">答案里每个数字必须在片段原文出现过，否则回退模板</text>
<rect x="40.0" y="776.0" width="520.0" height="48.0" rx="8" fill="#eaf4ef" stroke="#2e7d5b" stroke-width="1.3"/>
