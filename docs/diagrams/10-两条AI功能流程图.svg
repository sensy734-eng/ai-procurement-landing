<text x="870.0" y="410.0" font-size="9.8" fill="#5a6b7b" text-anchor="start" font-weight="normal">模型不接触数据库</text>
<rect x="640.0" y="440.0" width="520.0" height="76.0" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.3"/>
