<text x="610.0" y="320.0" font-size="11.5" fill="#5a6b7b" text-anchor="middle" font-weight="normal">库存变动流水</text>
<text x="610.0" y="337.0" font-size="9.6" fill="#9aa9b8" text-anchor="middle" font-weight="normal">before_qty → after_qty</text>
<text x="610.0" y="364.0" font-size="10.2" fill="#7c8fa3" text-anchor="middle" font-weight="normal">系统自动写入</text>
