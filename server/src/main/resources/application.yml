server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: procurement-server
  profiles:
    active: local
  servlet:
    multipart:
      # 资质附件上传上限 10MB，与 SupplierService.MAX_ATTACHMENT_SIZE 一致
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/procurement_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 本系统自有配置
app:
  session:
    # 会话超时分钟数，M11-1-2
    timeout-minutes: 480
  # 资质附件上传目录，M1-2-5，相对服务端工作目录，已加入 .gitignore
  upload:
    dir: uploads
  cors:
    allowed-origins: http://localhost:5173
  # 大模型接入（M7/M8/M9 的模型侧实现）
  # 默认关闭：不填 key 时全部走规则式链路，行为与接入前一致。
  # 密钥请写进 application-local.yml 或环境变量 LLM_API_KEY，不要提交到仓库。
  llm:
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-flash}
    temperature: 0.1
    timeout-ms: ${LLM_TIMEOUT_MS:30000}
    max-tokens: 900
    # 思维链开关，透传 thinking.type。留空不发该字段（多数厂商不认）；
    # DeepSeek-V4 系列需配 disabled，否则短任务正文为空
    thinking-type: ${LLM_THINKING_TYPE:}
    # 三处可分别开关，便于做「只换意图」「只换答案」的消融对比
    route-enabled: true
    intent-enabled: true
    answer-enabled: true
    # 生成后数字一致性校验：编造数字则回退模板
    number-guard: true

logging:
  level:
    com.zufe.procurement: info
