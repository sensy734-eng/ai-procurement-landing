server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: procurement-server
  profiles:
    active: local
  servlet:
    multipart:
      # 资质附件上传上限 10MB，与 SupplierService.MAX_ATTACHMENT_SIZE 一致
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/procurement_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 本系统自有配置
app:
  session:
    # 会话超时分钟数，M11-1-2
    timeout-minutes: 480
  # 资质附件上传目录，M1-2-5，相对服务端工作目录，已加入 .gitignore
  upload:
    dir: uploads
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.zufe.procurement: info
