<text x="960.0" y="161.0" font-size="9.6" fill="#9aa9b8" text-anchor="middle" font-weight="normal">到货量 = 合格量 + 不合格量</text>
<text x="960.0" y="80.0" font-size="10.2" fill="#7c8fa3" text-anchor="middle" font-weight="normal">仓管员登记验收</text>
