<text x="260.0" y="161.0" font-size="9.6" fill="#9aa9b8" text-anchor="middle" font-weight="normal">生命周期 + 审核结果</text>
<text x="260.0" y="80.0" font-size="10.2" fill="#7c8fa3" text-anchor="middle" font-weight="normal">采购员建单提交</text>
