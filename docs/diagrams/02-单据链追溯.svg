<line x1="378.0" y1="307.0" x2="485.0" y2="307.0" stroke="#41556b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="374.0" y="267.0" width="122.1" height="34.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="435.0" y="283.0" font-size="9.2" fill="#41556b" text-anchor="middle" font-weight="600">source_type / source_id</text>
<text x="435.0" y="296.0" font-size="9.2" fill="#7c8fa3" text-anchor="middle" font-weight="normal">冲减记负向流水</text>
<line x1="728.0" y1="307.0" x2="835.0" y2="307.0" stroke="#41556b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="721.4" y="267.0" width="127.1" height="34.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="785.0" y="283.0" font-size="9.8" fill="#41556b" text-anchor="middle" font-weight="600">唯一键维度</text>
<text x="785.0" y="296.0" font-size="9.2" fill="#7c8fa3" text-anchor="middle" font-weight="normal">物料 + 仓库 + 批次 + 归属</text>
<rect x="8.0" y="380.0" width="1184.0" height="52.0" rx="6" fill="#fbfcfd" stroke="#e3e9f1" stroke-width="1"/>
<text x="24.0" y="400.0" font-size="11.2" fill="#41556b" text-anchor="start" font-weight="600">行级追溯：</text>
<text x="86.0" y="400.0" font-size="11.2" fill="#5a6b7b" text-anchor="start" font-weight="normal">purchase_order_item.source_request_item_id 指回申请行，inbound_item.order_item_id 指回订单行。</text>
<text x="24.0" y="420.0" font-size="10.8" fill="#41556b" text-anchor="start" font-weight="600">追溯方向：</text>
<text x="86.0" y="420.0" font-size="10.4" fill="#7c8fa3" text-anchor="start" font-weight="normal">stock_flow → inbound_order → arrival_inspection → purchase_order → purchase_request</text>
</svg>