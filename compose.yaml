name: procurement-ai-workbench
services:
  db:
    image: mysql:8.4
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: procurement_db
      MYSQL_USER: workbench
      MYSQL_PASSWORD: ${DEMO_DB_PASSWORD:-workbench-local-only}
      MYSQL_ROOT_PASSWORD: ${DEMO_ROOT_PASSWORD:-root-local-only}
    volumes:
      - workbench-db:/var/lib/mysql
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-workbench.sh:ro
      - ./db:/workbench-db:ro
      - ./deploy:/workbench-deploy:ro
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./server
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: compose
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/procurement_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: workbench
      SPRING_DATASOURCE_PASSWORD: ${DEMO_DB_PASSWORD:-workbench-local-only}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_THINKING_TYPE: ${LLM_THINKING_TYPE:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      KB_RETRIEVAL_STRATEGY: ${KB_RETRIEVAL_STRATEGY:-bm25_hash}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - workbench-uploads:/app/uploads
  web:
    build: ./web
    ports:
      - 127.0.0.1:18080:80
    depends_on:
      - backend
volumes:
  workbench-db:
  workbench-uploads:
